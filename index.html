                        this.data.areas.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
                    if(currentVal) taskAreaSelect.value = currentVal;
                }
                this.filterEmployeesForNewTask(); // Initial population
            },

            // Tasks Admin
            addTask(e) {
                e.preventDefault();
                const title = document.getElementById('new-task-title').value;
                // Extraer el HTML de Quill. Si está vacío quitar las etiquetas sobrantes.
                const isDescEmpty = this.quill.getText().trim().length === 0;
                const description = isDescEmpty ? '' : this.quill.root.innerHTML;
                const areaId = document.getElementById('new-task-area').value;
                const employeeId = document.getElementById('new-task-employee').value;
                const priority = document.getElementById('new-task-priority').value;
                const requiresCount = document.getElementById('new-task-requires-count').value === 'true';
                
                // Generar un ID aleatorio único (ej. T-4821)
                let code = 'T-' + Math.floor(1000 + Math.random() * 9000);
                while (this.data.tasks.some(t => t.code === code)) {
                    code = 'T-' + Math.floor(1000 + Math.random() * 9000);
                }

                this.data.tasks.push({ 
                    id: 't_' + Date.now(), 
                    code, 
                    title,
                    description,
                    areaId,
                    employeeId,
                    priority,
                    requiresCount,
                    createdAt: new Date().toISOString()
                });
                this.saveData();
                document.getElementById('new-task-title').value = '';
                this.quill.setContents([]); // Vaciar editor
                document.getElementById('new-task-employee').value = '';
                document.getElementById('new-task-area').value = '';
                document.getElementById('new-task-priority').value = '';
                document.getElementById('new-task-requires-count').value = '';
                this.renderAdminTasks();
                this.showToast('Tarea agregada');
            },

            deleteTask(id) {
                this.data.tasks = this.data.tasks.filter(t => t.id !== id);
                this.saveData();
                this.renderAdminTasks();
                this.showToast('Tarea eliminada', 'info');
            },

            deleteOldProduct(id) {
                this.data.products = this.data.products.filter(p => p.id !== id);
                this.saveData();
                this.renderAdminTasks();
                this.showToast('Artículo antiguo eliminado', 'info');
            },

            deleteAllOldProducts() {
                this.data.products = [];
                this.saveData();
                this.renderAdminTasks();
                this.showToast('Todos los artículos antiguos han sido eliminados', 'success');
            },

            renderAdminTasks() {
                const container = document.getElementById('admin-task-list');
                
                let tasksHtml = '';
                if (this.data.tasks.length === 0) {
                    tasksHtml = '<p class="text-sm text-slate-500 dark:text-slate-400 text-center py-4">No hay tareas registradas.</p>';
                } else {
                    tasksHtml = `<h3 class="font-semibold text-slate-700 dark:text-slate-200 mt-2 mb-3 px-1 border-b border-slate-200 dark:border-slate-700 pb-2">Tareas Registradas</h3>` + this.data.tasks.map(t => {
                    const employee = this.data.employees.find(e => e.id === t.employeeId) || { name: 'Sin asignar' };
                    const area = this.data.areas.find(a => a.id === t.areaId) || { name: 'Sin área' };
                    let priorityLabel = 'Normal';
                    if(t.priority === 'alta') priorityLabel = 'Alta';
                    else if(t.priority === 'media') priorityLabel = 'Media';
                    else if(t.priority === 'baja') priorityLabel = 'Baja';

                    return `
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-lg shadow-sm border border-slate-100 dark:border-slate-700 flex justify-between items-center">
                        <div>
                            <span class="text-xs font-bold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded">${t.code}</span>
                            <p class="font-medium text-slate-700 dark:text-slate-200 mt-1">${t.title}</p>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs text-slate-400"><i class="ph ph-map-pin"></i> ${area.name}</span>
                                <span class="text-xs text-slate-500 dark:text-slate-400"><i class="ph ph-user"></i> ${employee.name}</span>
                                ${t.priority ? `<span class="text-[10px] font-semibold uppercase ${t.priority === 'alta' ? 'text-rose-600' : (t.priority === 'media' ? 'text-amber-600' : 'text-cyan-600')}"><i class="ph ph-flag"></i> Prioridad ${priorityLabel}</span>` : ''}
                            </div>
                        </div>
                        <button onclick="app.deleteTask('${t.id}')" class="text-slate-400 hover:text-red-500 p-2"><i class="ph ph-trash"></i></button>
                    </div>
                `}).join('');
                }

                let oldProductsHtml = '';
                if (this.data.products && this.data.products.length > 0) {
                    oldProductsHtml = `
                    <div class="mt-8 p-4 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800 rounded-xl">
                        <div class="flex items-start gap-3">
                            <i class="ph-fill ph-warning text-amber-500 text-2xl mt-1"></i>
                            <div>
                                <h3 class="font-semibold text-amber-800 dark:text-amber-400">Artículos Antiguos Detectados</h3>
                                <p class="text-sm text-amber-700 dark:text-amber-500 mb-4">Hemos encontrado "productos" de una versión anterior. Puedes eliminarlos para limpiar la base de datos.</p>
                            </div>
                        </div>
                        <div class="space-y-2 max-h-60 overflow-y-auto pr-2">
                            ${this.data.products.map(p => `
                                <div class="bg-white dark:bg-slate-800 p-3 rounded-lg shadow-sm border border-slate-100 dark:border-slate-700 flex justify-between items-center">
                                    <div>
                                        <span class="text-xs font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded">${p.code || 'S/C'}</span>
                                        <p class="font-medium text-slate-700 dark:text-slate-200 mt-1">${p.name || 'Sin Nombre'}</p>
                                    </div>
                                    <button onclick="app.deleteOldProduct('${p.id}')" class="text-slate-400 hover:text-red-500 p-2" title="Eliminar este artículo"><i class="ph ph-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="app.deleteAllOldProducts()" class="w-full mt-4 bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg transition-colors flex items-center justify-center gap-2"><i class="ph ph-trash"></i> Eliminar Todos los Artículos Antiguos</button>
                    </div>`;
                }

                container.innerHTML = tasksHtml + oldProductsHtml;
            },

            // Areas Admin
            addArea(e) {
                e.preventDefault();
                const name = document.getElementById('new-area-name').value;
                this.data.areas.push({ id: 'a_' + Date.now(), name });
                this.saveData();
                document.getElementById('new-area-name').value = '';
                this.renderAdminAreas();
                this.showToast('Área creada');
            },
            
            deleteArea(id) {
                this.data.areas = this.data.areas.filter(a => a.id !== id);
                // Also remove employees in this area to prevent orphans
                this.data.employees = this.data.employees.filter(e => e.areaId !== id);
                this.saveData();
                this.renderAll();
                this.showToast('Área y empleados vinculados eliminados', 'info');
            },

            renderAdminAreas() {
                const container = document.getElementById('admin-area-list');
                
                if (this.data.areas.length === 0) {
                    container.innerHTML = '<p class="text-sm text-slate-500 dark:text-slate-400 text-center py-4">No hay áreas registradas.</p>';
                    return;
                }
                container.innerHTML = `<h3 class="font-semibold text-slate-700 dark:text-slate-200 mt-2 mb-3 px-1 border-b border-slate-200 dark:border-slate-700 pb-2">Áreas Registradas</h3>` + this.data.areas.map(a => `
                    <div class="bg-white dark:bg-slate-800 p-3 rounded-lg shadow-sm border border-slate-100 dark:border-slate-700 flex justify-between items-center">
                        <p class="font-medium text-slate-700 dark:text-slate-200"><i class="ph ph-map-pin mr-2 text-slate-400"></i>${a.name}</p>
                        <button onclick="app.deleteArea('${a.id}')" class="text-slate-400 hover:text-red-500 p-2"><i class="ph ph-trash"></i></button>
                    </div>
                `).join('');
            },

            // Employees Admin
            addEmployee(e) {
                e.preventDefault();
                const name = document.getElementById('new-emp-name').value;
                const email = document.getElementById('new-emp-email').value;
                const role = document.getElementById('new-emp-role').value;
                const areaId = document.getElementById('new-emp-area').value;

                if (this.data.employees.some(emp => emp.email === email)) {
                    this.showToast('Este correo ya está registrado.', 'error');
                    return;
                }

                this.data.employees.push({ id: 'e_' + Date.now(), name, email, role, areaId });
                this.saveData();
                
                document.getElementById('new-emp-name').value = '';
                document.getElementById('new-emp-email').value = '';
                document.getElementById('new-emp-role').value = '';
                document.getElementById('new-emp-area').value = '';
                this.renderAdminEmployees();
                this.showToast('Empleado registrado');
            },

            deleteEmployee(id) {
                // Si el empleado a borrar es el usuario actual, limpiar el ID
                if (id === this.currentUserEmployeeId) this.currentUserEmployeeId = null;
                this.data.employees = this.data.employees.filter(e => e.id !== id);
                this.saveData();
                this.renderAdminEmployees();
                this.showToast('Empleado eliminado', 'info');
            },

            renderAdminEmployees() {
                const container = document.getElementById('admin-employee-list');
                
                if (this.data.employees.length === 0) {
                    container.innerHTML = '<p class="text-sm text-slate-500 dark:text-slate-400 text-center py-4">No hay personal registrado.</p>';
                    return;
                }
                container.innerHTML = `<h3 class="font-semibold text-slate-700 dark:text-slate-200 mt-2 mb-3 px-1 border-b border-slate-200 dark:border-slate-700 pb-2">Personal Registrado</h3>` + this.data.employees.map(e => {
                    const area = this.data.areas.find(a => a.id === e.areaId) || {name: 'Sin área'};
                    return `
                    <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-100 flex justify-between items-center">
                        <div>
                            <p class="font-bold text-slate-700">${e.name} ${e.id === this.currentUserEmployeeId ? '<span class="text-xs text-blue-500">(Tú)</span>' : ''}</p>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${e.role}</span>
                                <span class="text-xs text-slate-400" title="${e.email}"><i class="ph ph-envelope-simple"></i> Correo</span>
                                <span class="text-xs text-slate-400"><i class="ph ph-map-pin"></i> ${area.name}</span>
                            </div>
                        </div>
                        <button onclick="app.deleteEmployee('${e.id}')" class="text-slate-400 hover:text-red-500 p-2"><i class="ph ph-trash"></i></button>
                    </div>`;
                }).join('');
            }
        };

        // Boot
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
            
            // Lógica del botón de volver arriba
            const mainScroll = document.getElementById('main-scroll');
            const btnScrollTop = document.getElementById('btn-scroll-top');

            mainScroll.addEventListener('scroll', () => {
                if (mainScroll.scrollTop > 300) {
                    btnScrollTop.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
                    btnScrollTop.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
                } else {
                    btnScrollTop.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
                    btnScrollTop.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
                }
            });

            btnScrollTop.addEventListener('click', () => {
                mainScroll.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });

        // Eliminar Service Workers antiguos para evitar problemas de caché
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }

    </script>
</body>
</html>
